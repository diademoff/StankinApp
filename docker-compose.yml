services:
  api:
    build:
      context: .
      dockerfile: StankinAppDatabase/StankinAppApi/Dockerfile
    image: stankinapi:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - Database__Path=/app/data/schedule.db
      - Board__DbPath=/app/data/board.db
      - GeoIp__DbPath=/app/data/GeoLite2-Country.mmdb
      - Moderator__Secret=${Moderator__Secret}
      - Captcha__ServerSecret=${Captcha__Server__Secret}
    volumes:
      - ./deploy/data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    image: stankin-web:latest
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/data:/data
      - ./deploy/caddy/config:/config
    restart: unless-stopped
