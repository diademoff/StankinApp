<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Модерация</title>
  <meta name="theme-color" content="#4A90E2">
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="apple-touch-icon.jpg">
  <link rel="stylesheet" href="/src/input.css">
  <script type="module" src="/src/adminMain.ts"></script>
</head>

<body class="bg-gray-100 text-gray-800" x-data="adminApp" x-init="init()">
  <div class="min-h-screen max-w-xl mx-auto px-4 py-6">

    <header class="flex items-center justify-between mb-4">
      <h1 class="text-xl font-bold">Модерация</h1>
      <div class="flex gap-3 text-sm">
        <a href="/board.html" class="text-gray-500 hover:text-blue-600">Доска</a>
        <a href="/" class="text-gray-500 hover:text-blue-600">Расписание</a>
      </div>
    </header>

    <p x-show="error" class="text-red-500 text-sm mb-3" x-text="error"></p>

    <!-- ===== ВХОД ===== -->
    <template x-if="!isAuthed">
      <div class="bg-white rounded-2xl shadow-sm ring-1 ring-gray-200 p-4 space-y-3">
        <p class="text-sm font-medium">Вход для модераторов</p>
        <input type="password" x-model="secret" placeholder="Пароль" @keydown.enter="login()"
          class="w-full rounded-xl border border-gray-200 bg-gray-50 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        <button @click="login()"
          class="w-full py-2 bg-blue-600 text-white rounded-xl text-sm font-medium hover:bg-blue-700">Войти</button>
      </div>
    </template>

    <!-- ===== ОЧЕРЕДЬ ЖАЛОБ ===== -->
    <template x-if="isAuthed">
      <div class="space-y-3">
        <div class="flex items-center justify-between">
          <p class="text-sm text-gray-600">Жалоб в очереди: <span x-text="reports.length"></span></p>
          <div class="flex gap-3 text-sm">
            <button @click="load()" class="text-blue-600 hover:underline">Обновить</button>
            <button @click="logout()" class="text-gray-500 hover:text-red-500">Выйти</button>
          </div>
        </div>

        <template x-if="loading">
          <p class="text-center text-gray-500 py-6">Загрузка…</p>
        </template>
        <template x-if="!loading && reports.length === 0">
          <p class="text-center text-gray-500 py-6">Жалоб нет.</p>
        </template>

        <template x-for="r in reports" :key="r.id">
          <div class="bg-white rounded-2xl shadow-sm ring-1 ring-gray-200 p-4 space-y-2">
            <div class="flex items-center justify-between text-xs text-gray-500">
              <span class="font-semibold text-gray-700">#<span x-text="r.id"></span>
                <template x-if="r.threadId != null"> · в треде #<span x-text="r.threadId"></span></template>
              </span>
              <span class="bg-red-50 text-red-500 rounded-full px-2 py-0.5 font-medium">Жалоб: <span
                  x-text="r.reportCount"></span></span>
            </div>
            <div class="text-sm whitespace-pre-wrap break-words" x-text="r.text"></div>
            <div class="text-xs text-gray-500">IP: <code class="bg-gray-100 px-1 rounded" x-text="r.ipHash.slice(0, 12) + '…'"></code></div>
            <div class="flex gap-2">
              <button @click="deletePost(r.id)"
                class="px-3 py-1.5 bg-red-500 text-white rounded-lg text-xs font-medium hover:bg-red-600">Удалить</button>
              <button @click="dismiss(r.id)"
                class="px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg text-xs font-medium hover:bg-gray-200">Отклонить жалобы</button>
              <button @click="ban(r.ipHash)"
                class="px-3 py-1.5 bg-amber-700 text-white rounded-lg text-xs font-medium hover:bg-amber-800">Бан IP</button>
            </div>
          </div>
        </template>
      </div>
    </template>

  </div>
</body>

</html>
